      container.cardRedirects.REDIRECT_PAYMENT_EVENTS: $(dev_redirectPaymentEvents)
      container.cardRedirects.REDIRECT_PAYMENT_HOLDS: $(dev_redirectPaymentHolds)
      container.cardRedirects.REDIRECT_MANUAL_PAYMENTS: $(dev_redirectManualPayments)
