      container.pdsBaseUrl: $(prd_pdsBaseUrl)
      container.cardRedirects.REDIRECT_REPORTS: $(prd_redirectReports)
      container.cardRedirects.REDIRECT_PAYMENT_EVENTS: $(prd_redirectPaymentEvents)
      container.cardRedirects.REDIRECT_PAYMENT_HOLDS: $(prd_redirectPaymentHolds)
      container.cardRedirects.REDIRECT_MANUAL_PAYMENTS: $(prd_redirectManualPayments)
      container.cardRedirects.REDIRECT_AGREEMENT_CLOSURES: $(prd_redirectAgreementClosures)
      container.cardRedirects.REDIRECT_EMAIL_ALERTS: $(prd_redirectEmailAlerts)
