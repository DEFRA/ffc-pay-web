      container.bannerEnabled: $(test_bannerEnabled)
      container.bannerHeader: $(test_bannerHeader)
      container.bannerText: $(test_bannerText)
      container.bannerEmail: $(test_bannerEmail)
      container.pdsBaseUrl: $(test_pdsBaseUrl)
      container.cardRedirects.REDIRECT_REPORTS: $(test_redirectReports)
      container.cardRedirects.REDIRECT_PAYMENT_EVENTS: $(test_redirectPaymentEvents)
      container.cardRedirects.REDIRECT_PAYMENT_HOLDS: $(test_redirectPaymentHolds)
      container.cardRedirects.REDIRECT_MANUAL_PAYMENTS: $(test_redirectManualPayments)
      container.cardRedirects.REDIRECT_AGREEMENT_CLOSURES: $(test_redirectAgreementClosures)
      container.cardRedirects.REDIRECT_EMAIL_ALERTS: $(test_redirectEmailAlerts)
      container.cardRedirects.REDIRECT_STATEMENTS: $(test_redirectStatements)
      container.cardRedirects.REDIRECT_METRICS: $(test_redirectMetrics)
      container.cardRedirects.REDIRECT_RESET_PAYMENT_REQUESTS: $(test_redirectResetPaymentRequests)
    pre_params:
      container.azureStorageCreateContainers: $(pre_azureStorageCreateContainers)
      container.azureStorageUseConnectionString: $(pre_azureStorageUseConnectionString)
      container.manualPaymentsActive: $(pre_manualPaymentsActive)
      container.azureAppRegistrationEnabled: $(pre_azureAppRegistrationEnabled)
